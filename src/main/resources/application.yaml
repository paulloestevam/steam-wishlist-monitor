server:
  port: 8085

spring:
  application:
    name: steamwishlist-monitor
  mail:
    host: smtp.gmail.com
    port: 587
    username: paulloestevam@gmail.com
    password: aaaa aaaa aaaa aaaa # Senha de app
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

email:
  sender: "paulloestevam@gmail.com"

logging:
  file:
    # Use LOG_DIR environment variable to decide where logs are written
    # LOG_DIR must be set in the environment (or as a -D system property) before starting the app
    # Use LOG_DIR if set, otherwise fall back to local 'logs' folder
    name: ${LOG_DIR:logs}/console.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7
  level:
    root: INFO
    org.openqa.selenium: ERROR

webdriver:
  chrome:
    # Deixe vazio para usar Selenium Manager (recomendado - baixa automaticamente o chromedriver correto)
    # Ou aponte o caminho completo do chromedriver.exe se preferir usar manualmente
    driver-path: ""
  # Timeouts para requisições ao Steam
  page-load-timeout-seconds: 30
  implicit-wait-seconds: 15

steam:
  url: "https://store.steampowered.com/wishlist/id/paulloestevam/?sort=discount&min_discount=any"
#  url: "https://store.steampowered.com/wishlist/id/paulloestevam/?sort=discount"
  delay-between-requests-ms: 20000
  max-retries: 3
  retry-base-wait-ms: 10000  # Aguarda 10s, depois 20s, depois 40s

scheduler:
  time: "0 0 11 * * *" # Executa todo dia às 11:00

minDiscountPercentage: 60